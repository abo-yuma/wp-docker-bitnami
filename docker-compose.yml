services:
  mariadb:
    image: bitnami/mariadb:latest
    container_name: aboyuma_wp_db
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}

    volumes:
      - aboyuma_database_volume:/bitnami/mariadb
      - ./database/dump:/docker-entrypoint-initdb.d

    networks:
      - wp_network

  wordpress:
    image: bitnami/wordpress:latest
    container_name: aboyuma_wp_app
    restart: unless-stopped

    depends_on:
      - mariadb

    ports:
      - "${WP_PORT}:8080"

    environment:
      WORDPRESS_DATABASE_HOST: mariadb
      WORDPRESS_DATABASE_PORT_NUMBER: 3306

      WORDPRESS_DATABASE_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DATABASE_USER: ${MARIADB_USER}
      WORDPRESS_DATABASE_PASSWORD: ${MARIADB_PASSWORD}

      WORDPRESS_SKIP_BOOTSTRAP: ${WORDPRESS_SKIP_BOOTSTRAP}

    volumes:
      - ../wordpress:/bitnami/wordpress
      - ./php/custom.ini:/opt/bitnami/php/etc/conf.d/custom.ini

    networks:
      - wp_network

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: aboyuma_wp_phpmyadmin
    restart: unless-stopped

    depends_on:
      - mariadb

    ports:
      - "${PHPMYADMIN_PORT}:80"

    environment:
      PMA_HOST: mariadb

    networks:
      - wp_network

volumes:
  aboyuma_database_volume:

networks:
  wp_network:
