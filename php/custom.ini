; =========================================================
; Custom PHP Overrides
; =========================================================
;
; This file is mounted into:
;   /opt/bitnami/php/etc/conf.d/custom.ini
;
; It overrides default PHP settings without modifying base image files.
;
; Environment:
;   Local development
;
; Goals:
;   - Avoid delays in updating files changed in bind-mounted directories
;
; Trade-offs:
;   - Changes may take up to ~1 second to reflect (revalidate_freq=1)
;   - Setting revalidate_freq=0 would update instantly but slow down requests
;
; =========================================================
opcache.validate_timestamps=1
opcache.revalidate_freq=1