services:
  mariadb:
    image: bitnami/mariadb:latest
    container_name: aboyuma_wp_db
    restart: unless-stopped

    environment:
      # database credentials
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}

    volumes:
      - aboyuma_database_volume:/bitnami/mariadb

      # initialize database from SQL dump
      - ./database/dump:/docker-entrypoint-initdb.d

    networks:
      - wp_network

  wordpress:
    image: bitnami/wordpress:latest
    container_name: aboyuma_wp_app
    restart: unless-stopped

    depends_on:
      - mariadb

    ports:
      - "${WP_PORT}:8080"

    environment:
      WORDPRESS_DATABASE_HOST: mariadb
      WORDPRESS_DATABASE_PORT_NUMBER: 3306

      # WordPress credentials
      WORDPRESS_DATABASE_NAME: ${MARIADB_DATABASE}
      WORDPRESS_DATABASE_USER: ${MARIADB_USER}
      WORDPRESS_DATABASE_PASSWORD: ${MARIADB_PASSWORD}
      
      # disable default WordPress setup and use preloaded data from migration
      WORDPRESS_SKIP_BOOTSTRAP: yes

    volumes:
      # persit WordPress data
      - ../wordpress:/bitnami/wordpress

      # custom PHP/Apache config for local development
      - ./php/custom.ini:/opt/bitnami/php/etc/conf.d/custom.ini

      # mount migration assets
      - ../migration/wordpress_files:/migration/wordpress_files

      # init WordPress content(themes, plugins, uploads)
      # fix site url for migration
      - ./scripts:/docker-entrypoint-init.d/

    networks:
      - wp_network

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: aboyuma_phpmyadmin
    restart: unless-stopped

    depends_on:
      - mariadb

    ports:
      - "${PHPMYADMIN_PORT}:80"

    environment:
      PMA_HOST: mariadb

    networks:
      - wp_network

volumes:
  aboyuma_database_volume:

networks:
  wp_network:
